url: https://elkronos.github.io/anovakit/

template:
  bootstrap: 5
  bslib:
    primary: "#2c5d8f"
    code-font-scale: 0.9

authors:
  Justin Chase:
    href: https://github.com/elkronos

home:
  title: "anovakit: ANOVA workflows with assumption checks and effect sizes"
  description: >
    Eight analysis-of-variance workflows in R that share one argument
    convention and one return class, each with matched assumption checks,
    effect sizes, marginal means, pairwise comparisons and ggplot2 figures.
  sidebar:
    structure: [links, license, community, citation, authors, dev]

navbar:
  structure:
    left: [intro, choosing, walkthroughs, guides, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/anovakit.html
    choosing:
      text: Choose an analysis
      href: articles/choosing.html
    walkthroughs:
      text: Walkthroughs
      menu:
      - text: "One outcome, independent groups"
      - text: "Welch's ANOVA: anova_welch()"
        href: articles/welch.html
      - text: "Kruskal-Wallis: anova_kw()"
        href: articles/kruskal-wallis.html
      - text: "ANCOVA: anova_ancova()"
        href: articles/ancova.html
      - text: -------
      - text: "Repeated measures and several outcomes"
      - text: "Repeated measures: anova_rm()"
        href: articles/repeated-measures.html
      - text: "MANOVA: anova_manova()"
        href: articles/manova.html
      - text: -------
      - text: "Binary, count and other outcomes"
      - text: "Binary outcomes: anova_bin()"
        href: articles/binary.html
      - text: "Counts and rates: anova_count()"
        href: articles/counts.html
      - text: "Any GLM family: anova_glm()"
        href: articles/glm.html
    guides:
      text: Guides
      menu:
      - text: "Working with results"
        href: articles/results.html
      - text: "Diagnostics"
        href: articles/diagnostics.html
      - text: "Plots and themes"
        href: articles/visuals.html
      - text: "Weights and robust standard errors"
        href: articles/weights.html
      - text: "Design choices"
        href: articles/design.html
      - text: -------
      - text: "All articles"
        href: articles/index.html
    news:
      text: Changelog
      href: news/index.html

articles:
- title: Start here
  navbar: ~
  contents:
  - anovakit
  - articles/choosing
- title: "One outcome, independent groups"
  desc: >
    A walkthrough per function: the data, the fit, the output, effect sizes,
    comparisons, assumption checks, plots, options and a write-up.
  contents:
  - articles/welch
  - articles/kruskal-wallis
  - articles/ancova
- title: "Repeated measures and several outcomes"
  contents:
  - articles/repeated-measures
  - articles/manova
- title: "Binary, count and other outcomes"
  contents:
  - articles/binary
  - articles/counts
  - articles/glm
- title: Guides
  desc: Topics that apply to every function.
  contents:
  - articles/results
  - articles/diagnostics
  - articles/visuals
  - articles/weights
  - articles/design

reference:
- title: Analysis functions
  desc: >
    Each takes a data frame and column names given as character strings, and
    returns an `anovakit_fit`.
- subtitle: Continuous outcomes
  contents:
  - anova_welch
  - anova_kw
  - anova_ancova
  - anova_rm
  - anova_manova
- subtitle: Binary, count and other outcomes
  contents:
  - anova_bin
  - anova_count
  - anova_glm
- title: The fitted object
  desc: What every function returns, and the methods for it.
  contents:
  - anovakit_fit
  - print.anovakit_fit
  - summary.anovakit_fit
  - plot.anovakit_fit
- title: Package overview
  contents:
  - anovakit-package

news:
  cran_dates: false
